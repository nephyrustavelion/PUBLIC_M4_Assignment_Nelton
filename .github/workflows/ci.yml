name: TaskFlow CI

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  # ==========================================
  # BUILD JOB
  # ==========================================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java 21 with Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile and package application
        run: |
          mvn -B -ntp clean package -DskipTests

  # ==========================================
  # TEST JOB
  # ==========================================
  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java 21 with Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run automated tests
        run: |
          mvn -B -ntp test

      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: warn

  # ==========================================
  # SECURITY JOB - Snyk SCA + SAST
  # ==========================================
  security:
    runs-on: ubuntu-latest
    # needs: test

    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SNYK_ORG: ${{ vars.SNYK_ORG }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java 21 with Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Prepare Maven dependencies
        run: mvn -B -ntp clean install -DskipTests

      - name: Install Snyk CLI
        run: npm install -g snyk@1.1308.4

      # SCA - Dependency scanning
      - name: Snyk dependency scan
        run: |
          snyk test \
            --org="$SNYK_ORG" \
            --severity-threshold=high \
            --maven-skip-wrapper \
            --all-projects

      # SAST - Source code scanning
      - name: Snyk code scan
        if: ${{ success() || failure() }}
        run: |
          snyk code test \
            --severity-threshold=high

  # ==========================================
  # PUBLISH JOB
  # ==========================================
  publish:
    runs-on: ubuntu-latest
    # needs: security
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Configure Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Authenticate using GitHub Secrets
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Generate image tags automatically
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/taskflow
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Build, cache and publish
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha,scope=taskflow
          cache-to: type=gha,scope=taskflow,mode=max
