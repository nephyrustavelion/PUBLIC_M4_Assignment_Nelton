name: TaskFlow CI

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  # ==========================================
  # BUILD JOB
  # ==========================================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java 21 with Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile and package application
        run: |
          mvn -B -ntp clean package -DskipTests

  # ==========================================
  # TEST JOB
  # ==========================================
  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java 21 with Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run automated tests
        run: |
          mvn -B -ntp test

      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: warn

  # ==========================================
  # SECURITY JOB - Snyk SCA + SAST
  # ==========================================
  security:
    runs-on: ubuntu-latest
    # needs: test

    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SNYK_ORG: ${{ vars.SNYK_ORG }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java 21 with Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Prepare Maven dependencies
        run: mvn -B -ntp clean install -DskipTests

      - name: Install Snyk CLI
        run: npm install -g snyk@1.1308.4

      # SCA - Dependency scanning
      - name: Snyk dependency scan
        run: |
          snyk test \
            --file=pom.xml \
            --severity-threshold=high \
            --maven-skip-wrapper \
          

      # SAST - Source code scanning
      - name: Snyk code scan
        if: ${{ success() || failure() }}
        run: |
          snyk code test \
            --severity-threshold=high

  # ==========================================
  # PUBLISH JOB
  # ==========================================
  publish:
    runs-on: ubuntu-latest
    # needs: security
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Configure Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Authenticate using GitHub Secrets
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Generate image tags automatically
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/taskflow
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Build, cache and publish
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha,scope=taskflow
          cache-to: type=gha,scope=taskflow,mode=max

  # ==========================================
  # DEPLOY JOB
  # Redeploy TaskFlow API on Render
  # ==========================================
  deploy:
    runs-on: ubuntu-latest
    needs: publish

    # Deploy only when pushing to main
    if: github.ref == 'refs/heads/main'

    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      RENDER_CLI_VERSION: "2.7.0"

    steps:
      # Install Render CLI
      - name: Install Render CLI
        run: |
          curl -fsSL -o /tmp/render.zip \
            "https://github.com/render-oss/cli/releases/download/v${RENDER_CLI_VERSION}/cli_${RENDER_CLI_VERSION}_linux_amd64.zip"

          mkdir -p /tmp/render
          unzip -q /tmp/render.zip -d /tmp/render

          sudo mv \
            "/tmp/render/cli_v${RENDER_CLI_VERSION}" \
            /usr/local/bin/render

          render --version

      # Trigger Render deployment
      - name: Redeploy application on Render
        run: |
          set -eu

          : "${RENDER_API_KEY:?Missing RENDER_API_KEY}"
          : "${RENDER_SERVICE_ID:?Missing RENDER_SERVICE_ID}"

          echo "Deploying TaskFlow API to Render..."

          render deploys create "$RENDER_SERVICE_ID" \
            --image "docker.io/nephyrustavelion/taskflow:sha-${GITHUB_SHA::7}" \
            --wait \
            --confirm \
            --output text

          echo "Render deployment completed."

      # Verify deployed API
      - name: Verify Render API
        run: |
          curl --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            https://m4-assignment-nelton-taskflow.onrender.com/api/tasks

          echo "TaskFlow API is responding."
