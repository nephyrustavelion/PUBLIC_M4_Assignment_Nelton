
name: zap-baseline-scan

on:
  # Run manually after deployment
  workflow_dispatch:

  # Every Monday at 10:00 AM Singapore time
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ==========================================
      # 2. VERIFY RENDER API
      # ==========================================
      - name: Verify Render application
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::APP_URL variable is missing"
            exit 1
          fi

          echo "Checking TaskFlow API..."

          curl --fail-with-body \
            --silent \
            --show-error \
            --output /dev/null \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 90 \
            "$APP_URL"

          echo "TaskFlow API is responding."

      # ==========================================
      # 3. OWASP ZAP - DAST
      # ==========================================
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ vars.APP_URL }}

          # Do not automatically create GitHub issues
          allow_issue_writing: false

          # Report security alerts without blocking CI
          fail_action: false

      # ==========================================
      # 4. UPLOAD HTML REPORT
      # ==========================================
      - name: Upload ZAP HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: report_html.html
          archive: false
          if-no-files-found: warn

      # ==========================================
      # 5. GITHUB ACTIONS SUMMARY
      # ==========================================
      - name: Add ZAP report to job summary
        if: always()
        run: |
          if [ -f report_md.md ]; then
            cat report_md.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No ZAP report was generated." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
